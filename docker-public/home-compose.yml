services:
  homeassistant:
    container_name: homeassistant
    image: "ghcr.io/home-assistant/home-assistant:stable"
    restart: unless-stopped
    privileged: true
    network_mode: host
    environment:
      TZ: Pacific/Auckland
    volumes:
      - homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0

  matterbridge:
    container_name: matterbridge
    image: luligu/matterbridge:latest
    restart: always
    network_mode: host
    volumes:
      - matterbridge:/root/Matterbridge
      - matterbridge:/root/.matterbridge
      - matterbridge:/root/.mattercert

  airconnect:
    container_name: airconnect
    image: 1activegeek/airconnect
    restart: always
    network_mode: host
    environment:
      AIRCAST_VAR: -x /config/config.xml
      AIRUPNP_VAR: kill
    volumes:
      - airconnect:/config

volumes:
  homeassistant:
  airconnect:
  matterbridge:
