services:
  glance:
    container_name: glance
    image: glanceapp/glance:latest
    restart: unless-stopped
    environment:
      TZ: Pacific/Auckland
    ports:
      - 8080:8080
    volumes:
      - glance:/app/config

  syncthing:
    container_name: syncthing
    image: syncthing/syncthing:latest
    restart: unless-stopped
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - STGUIADDRESS=0.0.0.0:8384
    volumes:
      - syncthing:/var/syncthing
      - /mnt/sync:/var/syncthing/Sync

volumes:
  glance:
  syncthing:
